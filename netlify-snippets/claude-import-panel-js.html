<!--
Netlify Snippet Injection: "Claude Import Panel - JS"
Local: before </body>
Configurado em: Site settings > Build & deploy > Post processing > Snippet injection
Este arquivo é apenas para referência/documentação — o snippet real é injetado pelo Netlify
diretamente no HTML servido, e não faz parte do index.html do repositório.
-->
<script>
(function(){
function injectPanel(){
var el=document.getElementById('total-time-lista');
if(!el||document.getElementById('claude-import-panel'))return;
// Esconder FAB
var fab=document.getElementById('fab-plan');
if(fab)fab.style.display='none';
// Criar painel
var panel=document.createElement('div');
panel.id='claude-import-panel';
panel.innerHTML='<div id="claude-import-header" onclick="toggleClaudeImport()"><span style="font-size:18px">🤖</span><span style="font-weight:600;color:#185fa5;font-size:14px">Importar tarefas do Claude</span><span id="claude-import-arrow" style="margin-left:auto;color:#185fa5;font-size:12px;transition:transform 0.2s">▼</span></div><div id="claude-import-body"><p>Cole abaixo as tarefas geradas pelo Claude no chat. O sistema vai identificar e importar automaticamente.</p><textarea id="claude-import-text" placeholder="Ex:\n- Reunião com equipe | responsável: Hugo | categoria: Trabalho\n- Pagar conta de luz | categoria: Pessoal\n- Comprar presente | responsável: Maria | categoria: Família"></textarea><div id="claude-import-preview"></div><div class="claude-import-actions"><button id="claude-analyze-btn" onclick="previewClaudeTasks()">🔍 Analisar</button><button id="claude-import-btn" onclick="importClaudeTasks()">✅ Importar</button></div></div>';
el.insertAdjacentElement('afterend',panel);
}
window.toggleClaudeImport=function(){var b=document.getElementById('claude-import-body'),a=document.getElementById('claude-import-arrow'),o=b.style.display!=='none';b.style.display=o?'none':'block';a.style.transform=o?'rotate(0deg)':'rotate(180deg)';if(!o){document.getElementById('claude-import-preview').style.display='none';document.getElementById('claude-import-btn').style.display='none';}};
window.parseClaudeTasks=function(text){var lines=text.split('\n').map(function(l){return l.trim();}).filter(function(l){return l.length>2;});var parsed=[];for(var i=0;i<lines.length;i++){var line=lines[i];if(/^#{1,3}\s/.test(line)||/^[-=]{3,}$/.test(line))continue;var clean=line.replace(/^[-*•]\s+/,'').replace(/^\d+[\.)\s]+/,'').replace(/^[A-Za-z][\.)\s]+/,'').trim();if(!clean)continue;var taskName=clean,resp='',cat='',prio='circunstancial',date='',time='',durVal='',durUnit='min';if(clean.indexOf('|')!==-1){var parts=clean.split('|').map(function(p){return p.trim();});taskName=parts[0];for(var j=1;j<parts.length;j++){var p=parts[j].toLowerCase();if(/^respons[aá]vel:|^resp:/.test(p)){resp=parts[j].split(':').slice(1).join(':').trim();}else if(/^categoria:|^cat:/.test(p)){cat=parts[j].split(':').slice(1).join(':').trim();}else if(/^prioridade:|^prio:/.test(p)){var pv=parts[j].split(':').slice(1).join(':').trim().toLowerCase();prio=pv.indexOf('urgent')!==-1?'urgente':pv.indexOf('import')!==-1?'importante':pv.indexOf('deleg')!==-1?'delegar':'circunstancial';}else if(/^data:|^date:/.test(p)){date=parts[j].split(':').slice(1).join(':').trim();}else if(/^hora:|^time:/.test(p)){time=parts[j].split(':').slice(1).join(':').trim();}}}else{var rm=clean.match(/\brespons[aá]vel:\s*([^|,;]+)/i);var cm=clean.match(/\bcategoria:\s*([^|,;]+)/i);var pm=clean.match(/\bprioridade:\s*([^|,;]+)/i);if(rm){resp=rm[1].trim();taskName=taskName.replace(rm[0],'').trim();}if(cm){cat=cm[1].trim();taskName=taskName.replace(cm[0],'').trim();}if(pm){var pv2=pm[1].trim().toLowerCase();prio=pv2.indexOf('urgent')!==-1?'urgente':pv2.indexOf('import')!==-1?'importante':pv2.indexOf('deleg')!==-1?'delegar':'circunstancial';taskName=taskName.replace(pm[0],'').trim();}taskName=taskName.replace(/^[-:]\s*/,'').trim();}if(taskName.length>2)parsed.push({name:taskName,resp:resp,cat:cat,prio:prio,date:date,time:time,durVal:durVal,durUnit:durUnit});}return parsed;};
window.previewClaudeTasks=function(){var text=document.getElementById('claude-import-text').value,previewEl=document.getElementById('claude-import-preview'),importBtn=document.getElementById('claude-import-btn');if(!text.trim()){alert('Por favor, cole as tarefas antes de analisar.');return;}var parsed=parseClaudeTasks(text);if(parsed.length===0){previewEl.style.display='block';previewEl.innerHTML='<p class="claude-import-error">⚠️ Nenhuma tarefa identificada. Tente: <code>- Nome | responsável: Nome | categoria: Categoria</code></p>';importBtn.style.display='none';return;}var h='<div class="claude-preview-title">📋 '+parsed.length+' tarefa(s) identificada(s):</div><div class="claude-preview-scroll">';for(var i=0;i<parsed.length;i++){var t=parsed[i];h+='<div class="claude-preview-item"><strong>'+t.name+'</strong>'+(t.resp?'<span style="color:#666;margin-left:6px">👤 '+t.resp+'</span>':'')+(t.cat?'<span style="color:#666;margin-left:6px">🏷 '+t.cat+'</span>':'')+'<span style="color:#888;margin-left:6px;text-transform:capitalize">● '+t.prio+'</span></div>';}h+='</div>';previewEl.style.display='block';previewEl.innerHTML=h;importBtn.style.display='block';importBtn.textContent='✅ Importar '+parsed.length+' tarefa(s)';importBtn.dataset.parsedTasks=JSON.stringify(parsed);};
window.importClaudeTasks=function(){var importBtn=document.getElementById('claude-import-btn'),parsed=JSON.parse(importBtn.dataset.parsedTasks||'[]');if(!parsed.length)return;var count=0;for(var i=0;i<parsed.length;i++){try{var t=parsed[i],user=typeof getCurrentUser==='function'?getCurrentUser():null,newTask={id:typeof genId==='function'?genId():'task_'+Date.now()+'_'+Math.random().toString(36).substr(2,8),name:t.name,prio:t.prio||'circunstancial',cat:t.cat||'',resp:t.resp||'',date:t.date||'',time:t.time||'',durVal:t.durVal||'',durUnit:t.durUnit||'min',done:false,doneAt:null,shared:false,sharedWith:[],ownerEmail:user&&user.email?user.email:'',ownerId:user&&user.uid?user.uid:''};if(window.tasks)window.tasks.push(newTask);if(typeof fbSaveTask==='function')fbSaveTask(newTask);count++;}catch(e){console.error('Erro ao importar:',parsed[i].name,e);}}if(typeof render==='function')render();if(typeof renderStats==='function')renderStats();var previewEl=document.getElementById('claude-import-preview');previewEl.innerHTML='<div class="claude-import-success">✅ '+count+' tarefa(s) importada(s) com sucesso!</div>';document.getElementById('claude-import-btn').style.display='none';setTimeout(function(){document.getElementById('claude-import-text').value='';previewEl.style.display='none';toggleClaudeImport();},2500);};
// Injetar painel quando DOM estiver pronto
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',function(){setTimeout(injectPanel,500);});}else{setTimeout(injectPanel,500);}
// Também observar mudanças no DOM para garantir injeção após login
var observer=new MutationObserver(function(){if(document.getElementById('total-time-lista')&&!document.getElementById('claude-import-panel')){injectPanel();}});observer.observe(document.body,{childList:true,subtree:true});
})();
</script>
